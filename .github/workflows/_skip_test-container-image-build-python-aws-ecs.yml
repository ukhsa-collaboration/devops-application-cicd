name: "Test Container Image Build Workflow - Python"

on:
  workflow_call:
    inputs:
      runner_labels:
        description: JSON array of labels for the runner.
        required: false
        default: '["ubuntu-latest"]'
        type: string
  workflow_dispatch:
    inputs:
      runner_labels:
        description: JSON array of labels for the runner.
        required: false
        default: '["ubuntu-latest"]'
        type: string
  pull_request:
    branches:
      - main
    paths-ignore:
      - .github/workflows/_test-container-image-build-python-aws-ecs.yml
      - .github/workflows/container-image-build-python-aws-ecs.yml
      - .github/workflows/build-test-container.yml
      - .github/workflows/deploy-aws-ecs.yml
      - .github/scripts/build/**
      - .github/scripts/deploy/**
      - fixtures/python_container_app/**
      - docs/container-image-build-python-aws-ecs.md

jobs:
  container_image_build_regression_test:
    name: No workflow changes detected
    runs-on: ${{ fromJSON(inputs.runner_labels || '["ubuntu-latest"]') }}
    steps:
      - run: 'echo "No build required" '
